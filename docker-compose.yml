services:
  aula2000:
    container_name: aula2000
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "32807:8080"
    environment:
      - PORT=8080
    volumes:
      # Forráskód bind mount — kódmódosításnál azonnal érvényes, újraépítés nélkül
      - ./:/app
      # Anonymous volume — védi a konténer belső node_modules mappáját
      # (a build során fordított sqlite3-mal együtt)
      - /app/node_modules
      # Adat- és feltöltési kötetek megtartása
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    networks:
      - coolify

# Megjegyzés: A Traefik label-ek eltávolítva.
# A cloudflared Tunnel közvetlenül a konténer publikus portjára (32807) irányítja
# a forgalmat, megkerülve a Traefik-et. Az SSL-t a Cloudflare biztosítja az élponton,
# ezért Let's Encrypt/certresolver itt nem szükséges (és a meglévő label-ek az
# ACME ellenőrzés hibáját okozták: 403-as válasz).

networks:
  coolify:
    external: true
