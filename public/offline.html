<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Aula 2000</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0a0d11;color:#f5efe8;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
  .card{max-width:480px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:44px 32px;box-shadow:0 20px 50px rgba(0,0,0,0.4);}
  .wifi{width:64px;height:64px;margin:0 auto 22px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d5ab5d,#b8923f);color:#0a0d11;font-size:30px;font-weight:bold;}
  h1{font-size:1.5rem;margin-bottom:10px;}
  p{color:rgba(245,239,232,0.7);font-size:0.95rem;line-height:1.6;margin-bottom:26px;}
  .btn{display:inline-block;background:#d5ab5d;color:#0a0d11;text-decoration:none;font-weight:600;padding:12px 26px;border-radius:10px;font-size:0.95rem;}
  .btn:hover{opacity:0.9;}
  .note{margin-top:22px;font-size:0.8rem;color:rgba(245,239,232,0.4);}
</style>
</head>
<body>
  <div class="card">
    <div class="wifi"><span>✕</span></div>
    <h1>Jelenleg nincs internetkapcsolat</h1>
    <p>A kért oldal jelenleg nem érhető el offline módban. Ellenőrizze a kapcsolatát, majd próbálja meg újra.</p>
    <button class="btn" onclick="window.location.reload()">Újrapróbálkozás</button>
    <div class="note">Aula 2000 — Amint helyreáll a kapcsolat, az oldal továbbra is elérhető.</div>
  </div>
</body>
</html>
